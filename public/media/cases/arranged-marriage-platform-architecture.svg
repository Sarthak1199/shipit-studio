<svg viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 1. Input: Parallelogram -->
  <polygon points="220,20 480,20 460,60 200,60" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="45" font-size="13" fill="#111827" text-anchor="middle">Groom Bio-Data (PDF or Manual Entry)</text>

  <line x1="340" y1="60" x2="340" y2="92" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 2. Process: PDF extraction -->
  <rect x="220" y="96" width="240" height="42" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="340" y="122" font-size="11.5" fill="#111827" text-anchor="middle">PDF Extraction / Parsing</text>

  <line x1="340" y1="138" x2="340" y2="170" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 3. Split into two: DB + Photos -->
  <!-- DB cylinder -->
  <path d="M140,174 a70,9 0 1,0 140,0 v36 a70,9 0 1,1 -140,0 z" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <ellipse cx="210" cy="174" rx="70" ry="9" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="210" y="197" font-size="11" fill="#111827" text-anchor="middle">Google Sheets</text>
  <text x="210" y="209" font-size="9" fill="#6b7280" text-anchor="middle">Grooms / MyProfile</text>

  <!-- Cloudinary rectangle -->
  <rect x="400" y="174" width="160" height="46" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="480" y="197" font-size="11" fill="#111827" text-anchor="middle">Cloudinary</text>
  <text x="480" y="211" font-size="9" fill="#6b7280" text-anchor="middle">photo storage</text>

  <line x1="220" y1="97" x2="210" y2="174" stroke="#111827" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="460" y1="97" x2="480" y2="174" stroke="#111827" stroke-width="1" stroke-dasharray="3,2"/>

  <line x1="340" y1="230" x2="340" y2="262" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 4. Process: nakshatra derivation -->
  <rect x="220" y="266" width="240" height="42" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="340" y="292" font-size="11.5" fill="#111827" text-anchor="middle">Nakshatra Derivation (from DOB)</text>

  <line x1="340" y1="308" x2="340" y2="340" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 5. Decision-ish process row: Prokerala vs fallback -->
  <rect x="150" y="344" width="200" height="52" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="250" y="366" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600">Prokerala API</text>
  <text x="250" y="380" font-size="9.5" fill="#6b7280" text-anchor="middle">kundli-matching, cached</text>

  <rect x="370" y="344" width="200" height="52" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="470" y="366" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600">Local Ashtakoot Table</text>
  <text x="470" y="380" font-size="9.5" fill="#6b7280" text-anchor="middle">fallback if API unavailable</text>

  <line x1="290" y1="341" x2="290" y2="344" stroke="#111827" stroke-width="1.3"/>
  <line x1="340" y1="325" x2="250" y2="344" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="340" y1="325" x2="470" y2="344" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <line x1="340" y1="396" x2="340" y2="428" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 6. Output: Parallelogram -->
  <polygon points="200,432 480,432 460,482 220,482" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="454" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Groom List with Compatibility Score</text>
  <text x="340" y="470" font-size="10" fill="#4b5563" text-anchor="middle">password-gated, 72hr session</text>
</svg>
