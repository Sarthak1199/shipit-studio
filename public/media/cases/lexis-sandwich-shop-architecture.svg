<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 1. Input: Parallelogram -->
  <polygon points="230,20 470,20 450,60 210,60" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="45" font-size="13" fill="#111827" text-anchor="middle">GRN Photo Upload</text>

  <line x1="340" y1="60" x2="340" y2="92" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 2. Storage: Cylinder -->
  <path d="M260,96 a80,10 0 1,0 160,0 v40 a80,10 0 1,1 -160,0 z" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <ellipse cx="340" cy="96" rx="80" ry="10" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="122" font-size="12" fill="#111827" text-anchor="middle">Blob / Local Storage</text>

  <line x1="340" y1="146" x2="340" y2="178" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 3. Process: Rectangle -->
  <rect x="170" y="182" width="340" height="46" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="201" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600">Claude Vision OCR</text>
  <text x="340" y="217" font-size="10.5" fill="#4b5563" text-anchor="middle">Line-item extraction + PO matching</text>

  <line x1="340" y1="228" x2="340" y2="260" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 4. Row of 4 process rectangles -->
  <rect x="16" y="264" width="158" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="95" y="286" font-size="11" fill="#111827" text-anchor="middle">PO Matching</text>
  <text x="95" y="300" font-size="9" fill="#6b7280" text-anchor="middle">exact / fuzzy / manual</text>

  <rect x="182" y="264" width="158" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="261" y="286" font-size="11" fill="#111827" text-anchor="middle">Human Review</text>
  <text x="261" y="300" font-size="9" fill="#6b7280" text-anchor="middle">off-PO items flagged</text>

  <rect x="348" y="264" width="158" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="427" y="286" font-size="11" fill="#111827" text-anchor="middle">Price Variance</text>
  <text x="427" y="300" font-size="9" fill="#6b7280" text-anchor="middle">per vendor, per SKU</text>

  <rect x="514" y="264" width="158" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="593" y="286" font-size="11" fill="#111827" text-anchor="middle">Vendor Payables</text>
  <text x="593" y="300" font-size="9" fill="#6b7280" text-anchor="middle">from confirmed GRNs</text>

  <line x1="340" y1="314" x2="340" y2="346" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 5. Storage: Cylinder (Postgres) -->
  <path d="M260,350 a80,10 0 1,0 160,0 v40 a80,10 0 1,1 -160,0 z" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <ellipse cx="340" cy="350" rx="80" ry="10" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="376" font-size="12" fill="#111827" text-anchor="middle">Postgres (Neon)</text>

  <line x1="340" y1="400" x2="340" y2="432" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 6. Output: Parallelogram -->
  <polygon points="210,436 470,436 450,486 230,486" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="340" y="458" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">GRN-First Dashboard</text>
  <text x="340" y="474" font-size="10" fill="#4b5563" text-anchor="middle">Items received · Price trend · Payables</text>
</svg>
