<svg viewBox="0 0 760 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 0. Intake form -->
  <polygon points="260,16 500,16 480,58 240,58" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="380" y="41" font-size="12" fill="#111827" text-anchor="middle">Intake Form — link, name, category</text>

  <line x1="380" y1="58" x2="380" y2="86" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 1. Row of platform source boxes -->
  <rect x="140" y="90" width="140" height="40" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="210" y="114" font-size="11" fill="#111827" text-anchor="middle">Reddit</text>

  <rect x="310" y="90" width="140" height="40" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="114" font-size="11" fill="#111827" text-anchor="middle">Amazon</text>

  <rect x="480" y="90" width="140" height="40" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="550" y="114" font-size="11" fill="#111827" text-anchor="middle">Blinkit</text>

  <line x1="210" y1="130" x2="340" y2="162" stroke="#111827" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="380" y1="130" x2="380" y2="162" stroke="#111827" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="550" y1="130" x2="420" y2="162" stroke="#111827" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- 2. Scraping orchestrator -->
  <rect x="220" y="166" width="320" height="46" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="186" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Scraping Orchestrator</text>
  <text x="380" y="202" font-size="9.5" fill="#6b7280" text-anchor="middle">Gumloop, runs daily per pin code</text>

  <line x1="380" y1="212" x2="380" y2="244" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 3. Engine: dashed -->
  <rect x="160" y="248" width="440" height="46" fill="#ffffff" stroke="#111827" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="380" y="268" font-size="12" font-style="italic" fill="#111827" text-anchor="middle">Pin-Code Normalization + SKU Matching</text>
  <text x="380" y="284" font-size="9.5" fill="#6b7280" text-anchor="middle" font-style="italic">LLM-based matching across raw scrape output</text>

  <line x1="380" y1="294" x2="380" y2="326" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 4. Row of 4 -->
  <rect x="20" y="330" width="170" height="52" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="105" y="352" font-size="11" fill="#111827" text-anchor="middle">Price Tracking</text>
  <text x="105" y="366" font-size="8.5" fill="#6b7280" text-anchor="middle">per SKU, per pin code</text>

  <rect x="200" y="330" width="170" height="52" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="285" y="352" font-size="11" fill="#111827" text-anchor="middle">Availability Tracking</text>
  <text x="285" y="366" font-size="8.5" fill="#6b7280" text-anchor="middle">in-stock / out-of-stock</text>

  <rect x="380" y="330" width="170" height="52" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="465" y="352" font-size="11" fill="#111827" text-anchor="middle">Price-Move Alerts</text>
  <text x="465" y="366" font-size="8.5" fill="#6b7280" text-anchor="middle">vs. previous snapshot</text>

  <rect x="560" y="330" width="170" height="52" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="645" y="352" font-size="11" fill="#111827" text-anchor="middle">Stockout Alerts</text>
  <text x="645" y="366" font-size="8.5" fill="#6b7280" text-anchor="middle">gaps unnoticed for days</text>

  <line x1="380" y1="382" x2="380" y2="414" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 5. Storage: Cylinder -->
  <path d="M290,418 a90,10 0 1,0 180,0 v42 a90,10 0 1,1 -180,0 z" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <ellipse cx="380" cy="418" rx="90" ry="10" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="380" y="446" font-size="12" fill="#111827" text-anchor="middle">Postgres (Price History)</text>

  <line x1="380" y1="470" x2="380" y2="502" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 6. Claude Haiku report -->
  <rect x="200" y="506" width="360" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="528" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Claude Haiku — Report Formatter</text>
  <text x="380" y="544" font-size="9.5" fill="#6b7280" text-anchor="middle">summarizes moves, gaps, alerts into one email</text>

  <line x1="380" y1="556" x2="380" y2="588" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 7. Resend -->
  <rect x="260" y="592" width="240" height="42" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="618" font-size="11.5" fill="#111827" text-anchor="middle">Resend</text>

  <line x1="380" y1="634" x2="380" y2="666" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 8. Output -->
  <polygon points="220,670 540,670 520,714 240,714" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="380" y="688" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600">Daily Email Report</text>
  <text x="380" y="704" font-size="10" fill="#4b5563" text-anchor="middle">to brand owner, every morning</text>
</svg>
