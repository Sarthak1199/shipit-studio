<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 1. Two inputs: Redash + Google Sheets (parallelograms) -->
  <polygon points="80,20 320,20 300,64 60,64" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="190" y="46" font-size="12" fill="#111827" text-anchor="middle">Redash Queries</text>

  <polygon points="440,20 680,20 660,64 420,64" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="550" y="46" font-size="12" fill="#111827" text-anchor="middle">Google Sheets (Closures)</text>

  <line x1="190" y1="64" x2="330" y2="98" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="550" y1="64" x2="410" y2="98" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 2. Process: Cron sync jobs -->
  <rect x="240" y="102" width="280" height="46" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="122" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Scheduled Cron Sync</text>
  <text x="380" y="138" font-size="9.5" fill="#6b7280" text-anchor="middle">single-purpose routes, CRON_SECRET-gated</text>

  <line x1="380" y1="148" x2="380" y2="180" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 3. Storage: Cylinder -->
  <path d="M280,184 a100,10 0 1,0 200,0 v40 a100,10 0 1,1 -200,0 z" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <ellipse cx="380" cy="184" rx="100" ry="10" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="380" y="210" font-size="12" fill="#111827" text-anchor="middle">Postgres (Supabase) — MerchantSnapshot</text>

  <line x1="380" y1="234" x2="380" y2="266" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 4. Process: Prisma + computation layer -->
  <rect x="220" y="270" width="320" height="46" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="290" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Prisma Read + Computation Layer</text>
  <text x="380" y="306" font-size="9.5" fill="#6b7280" text-anchor="middle">funnel / KPI / ARPU math, separate from fetching</text>

  <line x1="380" y1="316" x2="380" y2="348" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 5. Row of 3 outputs -->
  <rect x="60" y="352" width="200" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="160" y="373" font-size="11.5" fill="#111827" text-anchor="middle">Dashboard</text>
  <text x="160" y="387" font-size="9" fill="#6b7280" text-anchor="middle">account-centric view</text>

  <rect x="280" y="352" width="200" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="380" y="373" font-size="11.5" fill="#111827" text-anchor="middle">Role-Based Access</text>
  <text x="380" y="387" font-size="9" fill="#6b7280" text-anchor="middle">sales/ops write, leadership read-only</text>

  <rect x="500" y="352" width="200" height="50" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="600" y="373" font-size="11.5" fill="#111827" text-anchor="middle">Weekly Email Cron</text>
  <text x="600" y="387" font-size="9" fill="#6b7280" text-anchor="middle">inline HTML + SVG charts</text>

  <line x1="600" y1="402" x2="600" y2="434" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 6. Output: Parallelogram -->
  <polygon points="480,438 720,438 700,482 460,482" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="590" y="464" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Report Email (Resend)</text>
</svg>
